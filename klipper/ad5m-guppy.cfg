# Macros the GuppyScreen of the Adventurer 5M (ghzserg/guppyscreen_ff5m) calls, written for Kiln OS.
# WORK IN PROGRESS, NOT TESTED. That GuppyScreen was written for zMod, whose Klipper config has these
# macros; Kiln OS has its own, so the names the screen sends are mapped here. What cannot work
# (a shell command module, zMod's multi-tool and power features) answers with an error message on
# the screen instead of an unknown-command shutdown. Included by ad5m.cfg.
#
# Standard Klipper commands the screen also uses (SET_PIN, SET_LED, SET_FAN_SPEED, M106, M109,
# M220/M221, SET_PRESSURE_ADVANCE, SET_VELOCITY_LIMIT, SET_RETRACTION, EXCLUDE_OBJECT, TEST_RESONANCES...)
# need nothing here, but need the named objects to exist: the LED and fan names in the screen's
# config are the ones in ad5m.cfg (chamber_led, chamber_fan, internal_fan, external_fan).

[gcode_macro _AD5M_NOT_AVAILABLE]
description: Tell the screen a feature is not there yet
gcode:
  RESPOND TYPE=error MSG="{params.WHAT|default('This function')} is not available on Kiln OS for the AD5M yet"

# The screen's free "code" button
[gcode_macro _GUPPY_MACRO]
description: Free button on the screen (nothing assigned)
gcode:
  RESPOND MSG="Nothing is assigned to this button"

# Single extruder: zMod's tool macros reduce to the plain heater
[gcode_macro _T_USE]
description: Select a tool (one extruder: nothing to do)
gcode:
  G4 P0

[gcode_macro _T_HEATER]
description: Set the extruder temperature (screen)
gcode:
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET={params.TEMP|default(0)|float}

# PID tuning from the screen. NOTE: SAVE_CONFIG cannot replace a PID value the factory config
# (ad5m.cfg) already sets: copy the result into local.cfg (docs/ad5m-port.md).
[gcode_macro PID_TUNE_EXTRUDER]
description: PID calibration of the extruder
gcode:
  PID_CALIBRATE HEATER=extruder TARGET={params.TEMPERATURE|default(215)|float}

[gcode_macro PID_TUNE_BED]
description: PID calibration of the bed
gcode:
  PID_CALIBRATE HEATER=heater_bed TARGET={params.TEMPERATURE|default(70)|float}

# The screen's "level the bed" button: Kiln's AUTO_BED_LEVEL with the temperatures already set
[gcode_macro AUTO_FULL_BED_LEVEL]
description: Make a bed mesh at the current target temperatures
gcode:
  {% set bed = printer.heater_bed.target|float %}
  {% set ext = printer.extruder.target|float %}
  AUTO_BED_LEVEL BED_TEMP={ bed if bed > 0 else 60 } EXTRUDER_TEMP={ ext if ext > 0 else 200 }

# TODO: check what zMod's version does; this is the screws-tilt report with a tare first
[gcode_macro BED_LEVEL_SCREWS_TUNE]
description: Report the bed screw adjustments
gcode:
  {% set bed = params.BED_TEMP|default(60)|float %}
  G28
  M140 S{bed}
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed}
  LOAD_CELL_TARE
  SCREWS_TILT_CALCULATE

