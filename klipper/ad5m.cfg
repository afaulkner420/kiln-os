# Flashforge Adventurer 5M / 5M Pro: mainline Klipper config, factory defaults.
#
# WORK IN PROGRESS, NOT TESTED ON A PRINTER. Draft ported by hand from the
# AD5M mod's printer.base.cfg (xblax/flashforge_ad5m_klipper_mod, GPL-3.0) to
# current mainline syntax, in the style of ad5x.cfg. Every value marked
# "TODO:" still needs checking on a real unit. Do not run motion on a printer
# before the MCU firmware, serial ports and endstops have been checked one by
# one (docs/ad5m-port.md).
#
# Installed read-only as /usr/share/ad5x/config/ad5m.cfg and included by the
# printer's own printer.cfg (klipper/printer-ad5m.cfg is its template). The
# 5M Pro extras are in ad5m-pro.cfg, included by that template on a Pro.
#
# Hardware (read from a real AD5M on 2026-11-17, plus the AD5M mod's configs):
#   [mcu]        mainboard, Nations N32G455 (Klipper "stm32f103xe" @144 MHz), /dev/ttyS5
#   [mcu eboard] toolhead board, N32G455 behind a 64 KB bootloader, /dev/ttyS1
#   No IFS, no purge box, no bed weighing board on the host UART.
#
# Requires mainline MCU firmware for both boards (klipper/mcu-configs/
# ad5m-*.mainline.config): MACH_N32G45x, 144 MHz, USART1, 230400 baud, eboard
# with the 64 KiB bootloader offset. The stock images are not a target.
#
# Macros: ad5m-macros.cfg (included at the end). Not here yet: setup.cfg (the AD5X's wizard
# is for the IFS and the purge box) and the quick actions. The load cell, which the probe
# needs a tare from, and the TVOC sensor need their own mainboard-MCU support: see
# ad5m-loadcell.cfg and docs/ad5m-port.md.

#####################################################################
# MCUs
#####################################################################

[mcu]
serial: /dev/ttyS5
baud: 230400
restart_method: command

[mcu eboard]
# Same bootloader as the AD5X eboard: it waits after power-on until the host
# sends 'A' (tools/boot_eboard.py does that handshake before klippy starts).
# TODO: confirm on the AD5M that the stock bootloader behaves the same.
serial: /dev/ttyS1
baud: 230400
restart_method: command

#####################################################################
# Kinematics
#####################################################################

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 20000
# Same limits as the AD5X, where 1 - 5000/20000 = 0.75 replaced max_accel_to_decel.
# The AD5M mod uses 0.5. TODO: pick one after a test print.
minimum_cruise_ratio: 0.75
max_z_velocity: 25
max_z_accel: 500
square_corner_velocity: 25

# TODO: coordinates. The AD5M mod and stock use a CENTRED bed (X/Y from -110
# to +110, endstops at +110), unlike ad5x.cfg (0..220, endstops at 220). Slicer
# profiles and the AD5X macros assume 0-based coordinates. Decide before the
# macros layer is written; the numbers below are the AD5M mod's.

[stepper_x]
step_pin: PC1
dir_pin: PC0
enable_pin: !PA1
microsteps: 16
rotation_distance: 40
# X and Y endstops are on the toolhead board: homing X or Y is a multi-MCU
# homing move over two 230400-baud UARTs. Stock raised the trsync timeout from
# 25 to 50 ms for this. TODO: if mainline reports "Communication timeout
# during homing", apply klipper/patches/trsync-timeout-50ms.patch.
endstop_pin: !eboard:PA15
position_endstop: 110
position_max: 110.1
position_min: -110
homing_speed: 25
homing_retract_dist: 5
homing_retract_speed: 25
second_homing_speed: 2.5

[stepper_y]
step_pin: PA3
dir_pin: PA2
enable_pin: !PA6
microsteps: 16
rotation_distance: 40
endstop_pin: !eboard:PB11
position_endstop: 110
position_max: 110.1
position_min: -110
homing_speed: 25
homing_retract_dist: 5
homing_retract_speed: 25
second_homing_speed: 2.5

[stepper_z]
step_pin: PC4
dir_pin: PA7
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
# Z homes to MAX on a dedicated switch, like the AD5X (bed fully down).
endstop_pin: PB15
position_endstop: 220
position_max: 230
position_min: -10
homing_speed: 25
homing_retract_dist: 5
homing_retract_speed: 12.5
second_homing_speed: 2.5

[tmc2209 stepper_x]
uart_pin: PC2
interpolate: True
run_current: 0.9
sense_resistor: 0.10

[tmc2209 stepper_y]
uart_pin: PA4
interpolate: True
run_current: 0.9
sense_resistor: 0.10

[tmc2209 stepper_z]
uart_pin: PC5
interpolate: True
run_current: 0.6
hold_current: 0.6
sense_resistor: 0.10

# NOTE: the stock fork disabled Klipper's periodic TMC error checks. Mainline
# has them on; marginal UART links may shut the printer down with TMC errors
# that stock silently ignored. Watch for it.

#####################################################################
# Homing
#####################################################################

# AD5M mod: Z first, then X, then Y, at reduced acceleration; moves the head
# away from the endstops afterwards so the plastic tab in the bed corner is not
# loaded. TODO: the destination (105,105,210) is for centred coordinates.
[homing_override]
axes: xyz
gcode:
  {% set all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
  SAVE_GCODE_STATE NAME=_ad5m_home
  M204 S5000
  {% if all or 'Z' in params %}
    G28 Z
  {% endif %}
  {% if all or 'X' in params %}
    G28 X
  {% endif %}
  {% if all or 'Y' in params %}
    G28 Y
  {% endif %}
  {% if all %}
    G90
    G1 X105 Y105 Z210 F1800
  {% endif %}
  RESTORE_GCODE_STATE NAME=_ad5m_home

[force_move]
enable_force_move: True

[query_endstops]

#####################################################################
# Extruder and hotend (eboard)
#####################################################################

[extruder]
step_pin: eboard:PB14
dir_pin: !eboard:PB15
enable_pin: !eboard:PB12
microsteps: 16
# The AD5M mod's printer.cfg: 4.4 ("default value from Flashforge"). TODO: calibrate
# (the AD5X's is 4.39185).
rotation_distance: 4.4
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: eboard:PA8
sensor_type: Generic 3950
sensor_pin: eboard:PA0
# PID from the AD5M mod (calibrated on one AD5M, target 215). TODO: PID_CALIBRATE on this unit.
control: pid
pid_Kp: 33.443
pid_Ki: 4.372
pid_Kd: 63.961
min_temp: 0
max_temp: 350
min_extrude_temp: 170
pressure_advance: 0.035
pressure_advance_smooth_time: 0.040
max_extrude_only_distance: 1500.0
max_extrude_cross_section: 1000

# Hotend power enable: eboard:PA8 only switches the heater, its supply is
# enabled by eboard:PB7, which stock firmware drove itself.
[output_pin _extruder_heater]
pin: eboard:PB7
value: 1
shutdown_value: 0

[verify_heater extruder]
max_error: 120
check_gain_time: 200
hysteresis: 10
heating_gain: 10

[tmc2209 extruder]
uart_pin: eboard:PB10
interpolate: True
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.10

#####################################################################
# Bed
#####################################################################

[heater_bed]
heater_pin: PB9
sensor_type: Generic 3950
sensor_pin: PC3
pullup_resistor: 4700
# PID from the AD5M mod (calibrated on one AD5M, target 70). TODO: PID_CALIBRATE on this unit.
# The AD5X limits the bed to 40% duty; the AD5M mod leaves it at 100% (its PID values were
# found that way, so the 0.4 below changes how they behave: calibrate again). Check the
# heater and PSU rating before raising max_power.
control: pid
pid_Kp: 74.793
pid_Ki: 1.619
pid_Kd: 863.863
max_power: 0.4
min_temp: 0
max_temp: 130

[verify_heater heater_bed]
max_error: 120
check_gain_time: 200
hysteresis: 10
heating_gain: 10

#####################################################################
# Fans, LED
#####################################################################

[heater_fan hotend_fan]
pin: eboard:PB4
max_power: 1.0
heater: extruder
heater_temp: 50.0

[fan]
pin: eboard:PB5

[controller_fan stepper_driver_fan]
pin: PB7
stepper: stepper_x, stepper_y, stepper_z
fan_speed: 0.8
idle_timeout: 0

# TODO: confirm which of these two exist on the plain 5M; the AD5M mod
# defines them for both models.
[fan_generic chamber_fan]
pin: PC6
hardware_pwm: True
enable_pin: PC7

[led chamber_led]
white_pin: PA8
hardware_pwm: False
initial_white: 1

#####################################################################
# Probe, mesh
#####################################################################

# PB4 is the trigger from the load cell board (the AD5M mod's config). It is only meaningful
# after a tare over the board's UART (LOAD_CELL_TARE in ad5m-macros.cfg, needs
# ad5m-loadcell.cfg): until that exists, do not probe. TODO: confirm pin and polarity.
[probe]
pin: !PB4
speed: 1
lift_speed: 5
samples: 1
# The AD5M mod's value (also the AD5X's). TODO: set this unit's with the Z offset step.
z_offset: -0.25

# From the AD5M mod (calibrated on one AD5M). TODO: re-run SHAPER_CALIBRATE
[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 52.5
shaper_type_y: zv
shaper_freq_y: 50

[bed_mesh]
speed: 300
horizontal_move_z: 1
move_check_distance: 5
mesh_min: -105, -105
mesh_max: 105, 105
probe_count: 5, 5
mesh_pps: 3, 3
algorithm: bicubic
bicubic_tension: 0.2

# SKEW_PROFILE LOAD=skew_profile (START_PRINT) needs this profile to exist; all zeros = none
[skew_correction skew_profile]
xy_skew: 0.0
xz_skew: 0.0
yz_skew: 0.0

[screws_tilt_adjust]
screw1: -94, -94
screw1_name: Left Near
screw2: 94, -94
screw2_name: Right Near
screw3: 94, 94
screw3_name: Right Far
screw4: -94, 94
screw4_name: Left Far
horizontal_move_z: 1
speed: 300
screw_thread: CW-M4

#####################################################################
# Sensors and inputs
#####################################################################

# The unused filament sensor input E1 must be configured as an input or the
# runout sensor does not work (AD5M mod).
[gcode_button _e1_sensor_input]
pin: !PE1
press_gcode:
  G4 P0

# TODO: stock called its own runout macro; this just pauses.
[filament_switch_sensor runout_sensor]
pause_on_runout: True
switch_pin: !PB14
event_delay: 1.0

[adxl345]
cs_pin: eboard:PA4
spi_speed: 1000000
spi_software_sclk_pin: eboard:PA5
spi_software_mosi_pin: eboard:PA7
spi_software_miso_pin: eboard:PA6
axes_map: x, y, z
rate: 800

[resonance_tester]
accel_chip: adxl345
min_freq: 5
max_freq: 100
probe_points:
  0, 0, 100

# Power pins. The AD5M mod says it does not know what they do; PC14 is held
# high and PG1 low as stock leaves them, so a Klipper start does not cut power.
# TODO: identify them (a button on PC15 is probably the power button).
[output_pin _power_off]
pin: PC14
value: 1
shutdown_value: 1

[output_pin _clear_power_off]
pin: PG1
value: 0
shutdown_value: 0

#####################################################################
# Printing support
#####################################################################

[gcode_arcs]
resolution: 1.0

[firmware_retraction]
retract_length: 0.8
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 35

[virtual_sdcard]
path: /home/klipper/printer_data/gcodes
on_error_gcode: TURN_OFF_HEATERS

[idle_timeout]
timeout: 600

[pause_resume]
recover_velocity: 50

[display_status]

[exclude_object]

[respond]

# Print start / end, pause, filament, levelling (this file's directory)
[include ad5m-macros.cfg]

# TODO: the setup wizard (setup.cfg is the AD5X's) and the plugin list
#[include /home/klipper/printer_data/config/plugins-activ[e].cfg]
