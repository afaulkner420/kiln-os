# This printer's Klipper config (Kiln OS, Adventurer 5M / 5M Pro). WORK IN PROGRESS.
#
# The factory defaults come from the read-only system image. A Pro also
# includes ad5m-pro.cfg (the installer enables the line below from
# /etc/kiln-board). Put your own lasting settings in local.cfg.
[include /usr/share/ad5x/config/ad5m.cfg]
# [include /usr/share/ad5x/config/ad5m-pro.cfg]       # 5M Pro only
# [include /usr/share/ad5x/config/ad5m-loadcell.cfg]  # once the load cell module and MCU bridge exist

[include local.cfg]

# Klipper's SAVE_CONFIG writes the bed mesh and other calibration below.
