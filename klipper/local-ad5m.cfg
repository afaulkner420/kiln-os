# This printer's own settings (not the factory defaults). WORK IN PROGRESS (Adventurer 5M).
# Read last by printer.cfg, so anything here overrides the factory defaults. Created once at
# first boot and never overwritten by image updates: the place for lasting changes.
#
# Results of PID_CALIBRATE and similar that SAVE_CONFIG would write cannot replace an option
# the factory defaults already set (ad5m.cfg has PID values for both heaters, the input
# shaper and the probe's z_offset): copy the new values here instead, for example
#
#[extruder]
#pid_Kp: 
#pid_Ki: 
#pid_Kd: 
#
#[heater_bed]
#pid_Kp: 
#pid_Ki: 
#pid_Kd: 
#
#[probe]
#z_offset: -0.25
