# Flashforge Adventurer 5M Pro extras (chamber air handling).
# WORK IN PROGRESS, NOT TESTED. From the AD5M mod's printer.base.cfg and
# macros-pro.cfg (xblax/flashforge_ad5m_klipper_mod, GPL-3.0).
#
# Included after ad5m.cfg on a Pro. TODO: confirm which parts the plain 5M
# really lacks; the TVOC sensor and load cell need MCU support that mainline
# does not have yet (docs/ad5m-port.md).

[fan_generic internal_fan]
pin: PB6

[fan_generic external_fan]
pin: PB8

# Selects between circulating chamber air inside and venting outside.
[servo my_servo]
pin: PC9
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025
initial_angle: 95

[gcode_macro AIR_CIRCULATION_INTERNAL]
description: Turn on internal air circulation
gcode:
  SET_FAN_SPEED FAN=external_fan SPEED=0
  SET_FAN_SPEED FAN=internal_fan SPEED=1
  SET_SERVO SERVO=my_servo ANGLE=95

[gcode_macro AIR_CIRCULATION_EXTERNAL]
description: Turn on external air circulation
gcode:
  # 80% on the outside fan, as the AD5M mod, to keep it quiet
  SET_FAN_SPEED FAN=external_fan SPEED=0.8
  SET_FAN_SPEED FAN=internal_fan SPEED=1
  SET_SERVO SERVO=my_servo ANGLE=180

[gcode_macro AIR_CIRCULATION_STOP]
description: Turn off air circulation
gcode:
  SET_FAN_SPEED FAN=external_fan SPEED=0
  SET_FAN_SPEED FAN=internal_fan SPEED=0
  SET_SERVO SERVO=my_servo ANGLE=95
