# Flashforge AD5M load cell board (bed weight), behind the mainboard MCU. WORK IN PROGRESS,
# NOT TESTED, AND IT CANNOT LOAD YET: it needs the Klipper host module flashforge_loadcell.py
# and mainboard MCU firmware built with CONFIG_FLASHFORGE_LOADCELL (xblax's Klipper fork,
# GPL-3.0; not part of mainline Klipper or of this tree yet: docs/ad5m-port.md, "Load cell").
#
# The probe pin PB4 (ad5m.cfg) is this board's trigger; its zero comes from FLASHFORGE_LOAD_CELL_TARE
# (the board's H1 command over its UART at 9600 baud, which the MCU bridges). Include this
# file from printer.cfg once both exist; before that LOAD_CELL_TARE stops probing on purpose.
#
#   [include /usr/share/ad5x/config/ad5m-loadcell.cfg]

[flashforge_loadcell]
mcu: mcu

[temperature_sensor Load_Cell]
sensor_type: flashforge_loadcell
