# Flashforge Adventurer 5M / 5M Pro: macros, factory defaults (Kiln OS).
#
# WORK IN PROGRESS, NOT TESTED ON A PRINTER. Included by ad5m.cfg. Written for Kiln OS from
# the AD5M mod's macros.cfg (xblax/flashforge_ad5m_klipper_mod, GPL-3.0): the same print flow
# (start, prime, level on request, end, cancel), simplified, with these differences:
#   - PAUSE / RESUME / CANCEL_PRINT are ours (no Mainsail client.cfg), with a park spot;
#   - nothing here calls a shell command; the speaker uses Kiln's own module ([ad5x_sound]
#     gives M300 and PLAY_MIDI and plays the start, complete, paused and error sounds by itself);
#   - the bed is NEVER probed without a fresh tare of the load cell: if the load cell module
#     is not loaded the macros stop with an error instead (see LOAD_CELL_TARE below).
# Every "TODO:" needs checking on a real unit. The coordinates are the AD5M's own CENTRED ones
# (X/Y from -110 to +110, Z = nozzle height above the bed, 220 = bed fully down), as in ad5m.cfg.
#
# Slicer start G-code (OrcaSlicer, Flashforge's AD5M profile style; both names work):
#   START_PRINT EXTRUDER_TEMP=[nozzle_temperature_initial_layer] BED_TEMP=[bed_temperature_initial_layer_single]
#   PRINT_START EXTRUDER=[nozzle_temperature_initial_layer] BED=[bed_temperature_initial_layer_single]   (Kiln's AD5X names)
# End: END_PRINT or PRINT_END.

# The speaker (M300, PLAY_MIDI, event sounds) and the log mode: Kiln modules that do not
# depend on the board (klipper/extras/ad5x_sound.py, ad5x_log.py; the speaker's PWM channel
# is set up by S35ad5m-sound).
[ad5x_sound]

[ad5x_log]

[save_variables]
filename: /home/klipper/printer_data/config/variables.cfg

#####################################################################
# The load cell tare, which probing depends on
#####################################################################

# On the AD5M the probe's trigger and its zero come from the load cell board behind the
# mainboard MCU (UART at 9600 baud): stock and the AD5M mod tare it before every probing run.
# The command is FLASHFORGE_LOAD_CELL_TARE, from the [flashforge_loadcell] module (needs MCU
# firmware with the bridge and klipper/ad5m-loadcell.cfg; neither exists in this tree yet).
# Without it this macro STOPS the print or the mesh: probing an untared bed could press the
# nozzle into the plate.
[gcode_macro LOAD_CELL_TARE]
description: Zero the bed's load cell before probing
gcode:
  {% if 'flashforge_loadcell' in printer.configfile.config %}
    FLASHFORGE_LOAD_CELL_TARE
  {% else %}
    {action_raise_error("LOAD_CELL_TARE: the load cell module is not loaded (include ad5m-loadcell.cfg once the mainboard firmware has the bridge). Probing is refused without a tare.")}
  {% endif %}

#####################################################################
# Print start / end
#####################################################################

# Parameters (the AD5M mod's names): BED_TEMP, EXTRUDER_TEMP, DISABLE_PRIMING=1,
# DISABLE_SKEW_CORRECT=1, FORCE_LEVELING=1 (a new mesh even when one is loaded).
[gcode_macro START_PRINT]
description: Home, heat, level when needed, prime the nozzle
gcode:
  {% set bed_temp = params.BED_TEMP|default(60)|float %}
  {% set extruder_temp = params.EXTRUDER_TEMP|default(200)|float %}
  {% set disable_priming = params.DISABLE_PRIMING|default(0)|int %}
  {% set disable_skew = params.DISABLE_SKEW_CORRECT|default(0)|int %}
  {% set force_leveling = params.FORCE_LEVELING|default(0)|int %}
  M140 S{bed_temp}
  SET_SKEW CLEAR=1
  _SET_GCODE_OFFSET Z=0
  G28
  # a mesh is made when none is loaded (or when asked for); it heats and wipes as needed
  {% if (not printer.bed_mesh.profile_name) or force_leveling %}
    AUTO_BED_LEVEL BED_TEMP={bed_temp} EXTRUDER_TEMP={extruder_temp}
  {% endif %}
  # the saved print Z offset (variables.cfg zoffset: the wizard and the screen set it)
  _APPLY_Z_OFFSET
  G90
  G1 Z10 F1800
  # the bed's temperature, not its stability
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp}
  M109 S{extruder_temp}
  {% if not disable_priming %}
    _PRIME_NOZZLE
  {% endif %}
  {% if not disable_skew %}
    SKEW_PROFILE LOAD=skew_profile
  {% endif %}

# Kiln's AD5X name for the same thing (BED, EXTRUDER; TOOL, LEVEL, ADAPTIVE and SOAK are the
# AD5X's and are ignored here except LEVEL=1)
[gcode_macro PRINT_START]
description: START_PRINT with Kiln's parameter names (BED, EXTRUDER, LEVEL)
gcode:
  {% set bed = params.BED|default(60)|float %}
  {% set ext = params.EXTRUDER|default(200)|float %}
  {% set level = params.LEVEL|default(0)|int %}
  START_PRINT BED_TEMP={bed} EXTRUDER_TEMP={ext} FORCE_LEVELING={level}

# From the Flashforge AD5M OrcaSlicer profile (as the AD5M mod): two lines along the front-left edge.
# TODO: check the lengths and the Z heights on this unit.
[gcode_macro _PRIME_NOZZLE]
gcode:
  G90
  M83
  G1 E-1.5 F800
  G1 X110 Y-110 F6000
  G1 E2 F800
  G1 Y-110 X55 Z0.25 F4800
  G1 X-55 E8 F2400
  G1 Y-109.6 F2400
  G1 X55 E5 F2400
  G1 Y-110 X55 Z0.45 F4800
  G1 X-55 E8 F2400
  G1 Y-109.6 F2400
  G1 X55 E5 F2400
  G92 E0

[gcode_macro END_PRINT]
description: Retract, heaters and fans off, park, motors off
gcode:
  G91
  G1 X-2 Y-2 E-5 F2000
  _COMMON_END_PRINT

[gcode_macro PRINT_END]
description: END_PRINT (Kiln's AD5X name)
gcode:
  END_PRINT

# End of a print and a cancel: heaters and fan off, park near the end stops (bed fully down), motors off
[gcode_macro _COMMON_END_PRINT]
gcode:
  SET_SKEW CLEAR=1
  M104 S0
  M140 S0
  M107
  G90
  G1 X105 Y105 Z220 F1500
  M84

[gcode_macro CANCEL_PRINT]
rename_existing: _CANCEL_PRINT_BASE
description: Cancel the print, heaters and fan off, park
gcode:
  _CANCEL_PRINT_BASE
  _COMMON_END_PRINT

# Fluidd and slicer start/end files use M24/M25 for resume/pause
[gcode_macro M24]
rename_existing: M24.1
gcode:
  {% if printer.pause_resume.is_paused %}
    RESUME
  {% else %}
    M24.1
  {% endif %}

[gcode_macro M25]
rename_existing: M25.1
gcode:
  PAUSE

#####################################################################
# Pause, resume, filament change
#####################################################################

# Park spot for PAUSE / M600 (nozzle lifted by lift mm first: Z is the nozzle height, so a
# larger Z is further from the print). TODO: check the park corner is clear of the clips.
[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
variable_park_x: -105
variable_park_y: -105
variable_lift: 10
variable_retract: 1.5
description: Pause the print, retract, lift and park
gcode:
  {% if not printer.pause_resume.is_paused %}
    {% set x = params.X|default(park_x)|float %}
    {% set y = params.Y|default(park_y)|float %}
    {% set zmax = printer.configfile.settings.stepper_z.position_max|float %}
    {% set z = [printer.toolhead.position.z + params.Z_LIFT|default(lift)|float, zmax - 0.5]|min %}
    BASE_PAUSE
    {% if printer.extruder.can_extrude %}
      G91
      G1 E-{retract} F2100
    {% endif %}
    G90
    G1 Z{z} F1500
    G1 X{x} Y{y} F6000
  {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
description: Resume a paused print
gcode:
  {% if printer.pause_resume.is_paused %}
    {% if printer.extruder.can_extrude %}
      M83
      G1 E{printer['gcode_macro PAUSE'].retract} F2100
    {% endif %}
    BASE_RESUME {rawparams}
  {% endif %}

[gcode_macro M600]
description: Filament change: pause, park and ask for the new filament
gcode:
  PAUSE
  M400
  RESPOND TYPE=command MSG="action:prompt_begin Filament change"
  RESPOND TYPE=command MSG="action:prompt_text Filament change requested. Load new filament and press Resume."
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button Load|LOAD_FILAMENT|primary"
  RESPOND TYPE=command MSG="action:prompt_button Unload|UNLOAD_FILAMENT|primary"
  RESPOND TYPE=command MSG="action:prompt_button Purge|PURGE_FILAMENT|primary"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_footer_button Resume|_INTERACTIVE_LOAD_END"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _INTERACTIVE_LOAD_END]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  RESUME

# The runout switch (ad5m.cfg's [filament_switch_sensor runout_sensor]) pauses by itself; this
# only adds the same prompt as M600. TODO: set runout_gcode: _FILAMENT_RUNOUT_EVENT there once tested.
[gcode_macro _FILAMENT_RUNOUT_EVENT]
gcode:
  M600

#####################################################################
# Filament load / unload (the heater must be on: extrusion needs min_extrude_temp)
#####################################################################

[gcode_macro LOAD_FILAMENT]
variable_load_distance: 125
description: Extrude the load distance (hotend hot)
gcode:
  {% set speed = params.SPEED|default(450) %}
  SAVE_GCODE_STATE NAME=load_state
  G91
  G92 E0
  G1 E{load_distance} F{speed}
  RESTORE_GCODE_STATE NAME=load_state

[gcode_macro UNLOAD_FILAMENT]
variable_unload_distance: 75
description: Retract the unload distance (hotend hot)
gcode:
  {% set speed = params.SPEED|default(450) %}
  SAVE_GCODE_STATE NAME=unload_state
  G91
  G92 E0
  G1 E-{unload_distance} F{speed}
  RESTORE_GCODE_STATE NAME=unload_state

[gcode_macro PURGE_FILAMENT]
variable_purge_distance: 25
description: Extrude the purge distance (hotend hot)
gcode:
  {% set speed = params.SPEED|default(450) %}
  SAVE_GCODE_STATE NAME=purge_state
  G91
  G92 E0
  G1 E{purge_distance} F{speed}
  RESTORE_GCODE_STATE NAME=purge_state

#####################################################################
# The print Z offset
#####################################################################

# Every Z offset set with SET_GCODE_OFFSET Z= or Z_ADJUST= (the screen's Z buttons, the wizard, baby-steps
# from a web interface or the console) is saved as save_variables zoffset = {'z': ..}. Prints apply it
# (_APPLY_Z_OFFSET, from START_PRINT). Macros that need a temporary offset call _SET_GCODE_OFFSET.
# Same scheme as Kiln OS on the AD5X, so the wizard's Z offset step works unchanged.
[gcode_macro SET_GCODE_OFFSET]
rename_existing: _SET_GCODE_OFFSET
description: Set the G-code offset; Z= and Z_ADJUST= are also saved as the print Z offset
gcode:
  {% set z = printer.gcode_move.homing_origin.z %}
  _SET_GCODE_OFFSET {rawparams}
  {% if 'Z' in params or 'Z_ADJUST' in params %}
    {% set new = params.Z|float if 'Z' in params else z + params.Z_ADJUST|float %}
    SAVE_VARIABLE VARIABLE=zoffset VALUE="{ {'z': new|round(4)} }"
  {% endif %}

# Apply the saved print Z offset (0 when none is saved); the offset sits on top of the mesh
[gcode_macro _APPLY_Z_OFFSET]
gcode:
  {% set saved = printer.save_variables.variables.zoffset|default({}) %}
  {% set z = saved.z if saved.z is number else 0.0 %}
  _SET_GCODE_OFFSET Z={z} MOVE=1

[gcode_macro SETUP_WIZARD]
description: Run the setup wizard again on the touch screen
gcode:
  SETUP_WIZARD_STEP ACTION=wizard

#####################################################################
# Bed levelling (the load cell probe)
#####################################################################

# Heat, wipe the nozzle on the plate's back edge (probing at two spots), cool the nozzle
# below ooze temperature, then mesh. Same steps as the AD5M mod. TODO: untested; the wipe
# positions are for centred coordinates and assume the plate is clean and the nozzle tip
# does not carry a blob.
[gcode_macro AUTO_BED_LEVEL]
description: Heat, wipe the nozzle and make a bed mesh
gcode:
  {% set bed_temp = params.BED_TEMP|default(60)|float %}
  {% set extruder_temp = params.EXTRUDER_TEMP|default(200)|float %}
  {% set profile = params.PROFILE|default("auto") %}
  BED_MESH_CLEAR
  {% if not "xyz" in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  G90
  G1 Z10 F1800
  M140 S{bed_temp - 2}
  TEMPERATURE_WAIT SENSOR=heater_bed MAXIMUM={bed_temp}
  M140 S{bed_temp}
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp}
  LOAD_CELL_TARE
  M104 S{extruder_temp}
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder_temp}
  _AD5M_NOZZLE_WIPE
  # nozzle below 120 C before the mesh, so it does not ooze onto the plate
  M106 S255
  M104 S0
  TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=120
  M107
  G1 X10 F300
  BED_MESH_CALIBRATE PROFILE="{profile}"

# The wipe: touch the plate twice at its back edge so plastic on the tip is scraped off, with the
# load cell already tared. No waits: the wizard calls it between abortable waits.
[gcode_macro _AD5M_NOZZLE_WIPE]
gcode:
  # wipe to the left
  G90
  G1 X50 Y110 Z5 F18000
  PROBE
  G91
  G1 X-40 F900
  # wipe to the right
  G90
  G1 X-50 Y110 Z5 F18000
  PROBE
  G91
  G1 X40 F900
  G90

# Parked: bed fully down, head at the rear corner by the end stops
[gcode_macro _AD5M_PARK]
gcode:
  G90
  G1 X105 Y105 Z220 F1500

# A tare before every mesh, as stock does
[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE_ORIG
gcode:
  G90
  G1 Z2 F1800
  LOAD_CELL_TARE
  _BED_MESH_CALIBRATE_ORIG {rawparams}

# The endstop is separate from the probe on this printer, so a saved endstop offset would be
# ineffective after levelling: save to the probe instead (as the AD5M mod)
[gcode_macro Z_OFFSET_APPLY_ENDSTOP]
rename_existing: _Z_OFFSET_APPLY_ENDSTOP
gcode:
  RESPOND MSG="Notice: the Z offset is saved to the probe on this printer (Z_OFFSET_APPLY_PROBE)."
  Z_OFFSET_APPLY_PROBE

#####################################################################
# Not here (compared with the AD5M mod's macros)
#####################################################################
# LCD_ON / LCD_OFF (the screen software owns the backlight: /usr/bin/ad5m-backlight), the
# reboot-to-stock and shutdown/power-button macros (a G-code macro cannot run a program until
# a shell-command module exists; "ad5m-handoff stock" does the first from SSH), air
# circulation (5M Pro: ad5m-pro.cfg), timelapse and power-loss recovery.
