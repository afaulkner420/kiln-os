# AD5M setup wizard: the Klipper side of the first-boot / on-demand setup
# (klipper/extras/ad5m_setup.py). WORK IN PROGRESS, NOT TESTED ON A PRINTER. Installed read-only next
# to ad5m.cfg, which includes it last. Override options in local.cfg.

[ad5m_setup]
# PID step: nozzle (part fan at pid_fan_speed, as when printing), then bed.
#pid_nozzle_temp: 220
#pid_bed_temp: 60
#pid_fan_speed: 1.0
# Self-check: every live output runs check_time seconds, then switches off. A heater passes when it
# rose check_*_rise C, watched until check_watch seconds after switching off (the sensors lag).
#check_time: 10
#check_watch: 10
#check_nozzle_temp: 120
#check_bed_temp: 50
#check_nozzle_rise: 3
#check_bed_rise: 0.5
# "part" is the part cooling fan ([fan], M106); the others are [fan_generic] names. On a 5M Pro add
# internal_fan, external_fan.
#check_fans: part, chamber_fan
#filament_sensor: runout_sensor
#require_loadcell: True
# Mesh step: stock's levelling temperatures.
#mesh_bed_temp: 60
#mesh_nozzle_temp: 140
#heat_timeout: 900
# Z offset step: test patch (one layer, lines along X) at the bed centre (X/Y 0,0 here: centred
# coordinates), later ones beside it; +/- steps of at most max_adjust, max_total_adjust in all.
# After user_timeout seconds without an answer the offset is kept.
#patch_center: 0, 0
#patch_size: 30
#patch_speed: 1800
#park_y: 105
# Every run starts fresh at patch_start_z, not at the saved offset (which may be stock's or zMod's,
# never printed with here): a little too high rather than scraping, lowered from there with -.
#patch_start_z: 0.1
#max_adjust: 0.5
#max_total_adjust: 1.0
#user_timeout: 900
# PID and input shaper results go here at STEP=finish (included below).
#tuning_file: /home/klipper/printer_data/config/ad5m-tuning.cfg
# SETUP_WIZARD leaves this file for the screen.
#wizard_flag: /home/klipper/printer_data/comms/run-setup-wizard

# Wizard results SAVE_CONFIG can't keep: ad5m.cfg sets the PID and input shaper values, and
# SAVE_CONFIG refuses values an included file also sets. Read after ad5m.cfg (so they win) and before
# local.cfg (so that still wins). The [g] makes it a pattern: no file, no error.
[include /home/klipper/printer_data/config/ad5m-tunin[g].cfg]
