# tslib for the Adventurer 5M's touch panel (SoC resistive controller, /dev/input/event0).
# The stock chain, without "module linear": GuppyScreen does the calibration itself (its first-start
# calibration screen, coefficients kept in guppyconfig.json), so a second calibration here would
# stack on top of it.
module_raw input
module pthres pmin=1
module dejitter delta=100
